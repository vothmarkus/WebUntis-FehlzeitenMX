name: Windows-Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'Quellcode/Windows/WebUntisAuswertung.csproj'
      - 'Quellcode/Installer/**'

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Release-Tag ermitteln
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content Quellcode/Windows/WebUntisAuswertung.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungültige Release-Version: $version" }
          "tag=v$version" >> $env:GITHUB_OUTPUT
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'GitHub-Releases konnten nicht geprüft werden.' }
          "build=$(-not ($existing -contains "v$version"))" >> $env:GITHUB_OUTPUT

      - name: NSIS einrichten
        if: steps.release.outputs.build == 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.11.0 --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'NSIS konnte nicht eingerichtet werden.' }

          # Die Standardinstallation von NSIS enthält nur x86-Stubs.
          # Das Debian-Paket derselben Version liefert die gebauten x64-Komponenten.
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $temp = Join-Path $env:RUNNER_TEMP 'nsis-x64'
          New-Item -ItemType Directory -Path $temp | Out-Null
          $package = Join-Path $temp 'nsis-common.deb'
          Invoke-WebRequest -UseBasicParsing 'https://deb.debian.org/debian/pool/main/n/nsis/nsis-common_3.11-1_all.deb' -OutFile $package
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          if ($digest -ne '103a3284c1a5356efa0aba90fdfc391c3cde8e7df8726377cef0f98471584047') { throw 'Unerwartete Prüfsumme für das NSIS-x64-Paket.' }
          7z x -tAr $package "-o$temp" data.tar.xz -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS-x64-Paket konnte nicht entpackt werden.' }
          tar -xf (Join-Path $temp 'data.tar.xz') -C $temp ./usr/share/nsis/Stubs ./usr/share/nsis/Plugins/amd64-unicode
          if ($LASTEXITCODE -ne 0) { throw 'NSIS-x64-Dateien konnten nicht entpackt werden.' }
          $debian = Join-Path $temp 'usr/share/nsis'
          Copy-Item (Join-Path $debian 'Stubs/*-amd64-unicode') (Join-Path $nsis 'Stubs')
          Copy-Item (Join-Path $debian 'Plugins/amd64-unicode') (Join-Path $nsis 'Plugins') -Recurse -Force
          if (!(Test-Path (Join-Path $nsis 'Stubs/lzma_solid-amd64-unicode'))) { throw 'Der NSIS-x64-Stub fehlt.' }

      - name: Setup bauen
        if: steps.release.outputs.build == 'True'
        shell: pwsh
        run: |
          ./Quellcode/Installer/Build-Setup.ps1 -OutputDirectory release

      - name: Setup veröffentlichen
        if: steps.release.outputs.build == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem release -Filter 'WebUntis-FehlzeitenMX-*-Setup-x64.exe' -File)
          if ($setup.Count -ne 1) { throw 'Es wurde kein eindeutiges Setup gebaut.' }
          $version = $env:RELEASE_TAG.Substring(1) -replace '\.0$'
          gh release create $env:RELEASE_TAG $setup[0].FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WebUntis-FehlzeitenMX $version" --latest --notes 'Windows-x64-Installer. Die App sucht unter Einstellungen nach GitHub-Updates. Dieses Setup ist unsigniert.'
          if ($LASTEXITCODE -ne 0) { throw 'Das GitHub-Release konnte nicht veröffentlicht werden.' }
